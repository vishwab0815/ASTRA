---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: astra-aiops-sa
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: astra-ops-role
  namespace: default
rules:
  # Astra needs to get and list pods, and describe events
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  # Astra needs to read pod logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Astra needs permission to restart pods (delete)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # IMPORTANT: No permission is granted for Deployments, Secrets, or Services.

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: astra-ops-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: astra-aiops-sa
    namespace: default
roleRef:
  kind: Role
  name: astra-ops-role
  apiGroup: rbac.authorization.k8s.io
